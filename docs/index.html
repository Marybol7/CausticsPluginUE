<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LiquidFX - TFG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>LiquidFX</h1>
    <p>Plugin de simulación visual de cáusticas y efectos líquidos en Unreal Engine.</p>
  </header>

  <main>
    <section>
      <h2>Descripción del proyecto</h2>
      <p>
        LiquidFX es un plugin modular desarrollado como Trabajo Fin de Grado,
        orientado a la creación de efectos líquidos en tiempo real.
      </p>
    </section>

    <section>
      <h2>Resultados visuales</h2>
      <img src="images/demo_general.png" alt="Vista general del nivel demo">
    </section>

    <section>
      <h2>Vídeo demostrativo</h2>
      <video controls width="800">
        <source src="videos/demo_liquidfx.mp4" type="video/mp4">
        Tu navegador no soporta vídeo HTML5.
      </video>
    </section>
  </main>
</body>
</html>
